name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  rails-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mypass12
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pmypass12"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:mypass12@127.0.0.1:3306/Sprint_Tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.4
          bundler-cache: true
      - name: Prepare database
        run: bundle exec rails db:create db:schema:load
      - name: Run tests
        run: bundle exec rails test

  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
